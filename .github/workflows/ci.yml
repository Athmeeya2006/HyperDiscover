name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "2"

permissions:
  contents: read

jobs:
  secrets:
    # tokens/passwords must never reach the repo (Kaggle, Ada); scans the full history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install "ruff>=0.6"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: Shell scripts parse
        run: for f in scripts/slurm/*.sh scripts/slurm/*.sbatch; do bash -n "$f"; done
      - name: SLURM env refuses unfilled config
        run: |
          set +e
          if grep -q TODO configs/paths/ada.yaml; then
            bash -c 'source scripts/slurm/ada_env.sh'; rc=$?
            test "$rc" -eq 2 || { echo "ada_env.sh should exit 2 while TODOs remain (got $rc)"; exit 1; }
          fi

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the Ada conda env; torch 2.4.1 matches its pinned version (CLAUDE.md §3.3)
        include:
          - python: "3.10"
            torch: "2.4.1"
            numpy: "numpy<2"
          - python: "3.12"
            torch: "2.5.1"
            numpy: "numpy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ matrix.numpy }}" -e ".[dev,baselines]"
      - name: Unit tests (no PySR, no slow gate)
        run: pytest -m "not slow and not pysr" --durations=10

  package:
    # Phase-8 item: the wheel builds and installs cleanly in a fresh environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install build
      - run: python -m build
      - name: Install wheel in a clean venv and import
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          /tmp/clean/bin/pip install "numpy<2" dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import hyperdiscover, hyperdiscover.baselines, hyperdiscover.eval; print(hyperdiscover.__version__)"

  smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" -e ".[dev,baselines]"
      - name: Environment check (CPU)
        run: python scripts/check_env.py --cpu-only
      - name: Benchmark generation
        run: |
          python scripts/make_benchmark.py --grid configs/experiment/grid_ci.yaml --list
          python scripts/make_benchmark.py --grid configs/experiment/grid_ci.yaml --out ci_bench
      - name: Baselines
        run: python scripts/run_baselines.py --benchmark-file ci_bench/S4_open_N8_noise0_seed0.h5 --out ci_runs_baselines/S4
      - name: End-to-end pipeline (library engine) + visual walkthrough
        run: python scripts/run_pipeline.py --experiment configs/experiment/smoke.yaml --out ci_runs/smoke --visualize
      - name: Split fit / distill stages
        run: |
          python scripts/run_pipeline.py --benchmark-file ci_bench/S2_open_N8_noise0_seed0.h5 --stage fit \
            --out ci_runs/split --config configs/train/fast.yaml --set train.pairwise.steps=30 \
            --set train.triadic.steps=30 --set train.joint.steps=10
          python scripts/run_pipeline.py --benchmark-file ci_bench/S2_open_N8_noise0_seed0.h5 --stage distill \
            --out ci_runs/split --engine library
      - name: Tables from metrics JSON
        run: python scripts/evaluate.py --runs ci_runs --baselines ci_runs_baselines --out ci_paper
      - name: Systems visualisation (no training)
        run: python scripts/visualize_pipeline.py --systems-only --N 8 --out ci_viz
      - name: Packing, profiling and Kaggle tooling
        run: |
          python scripts/run_many.py --grid configs/experiment/grid_ci.yaml --bench-dir ci_bench --runs-dir ci_runs/many --dry-run
          python scripts/profile_memory.py --device cpu --N 6 --steps 2 --batch 8 --hidden 8
          python scripts/kaggle/kaggle_job.py --help > /dev/null
          python -m py_compile scripts/kaggle/kernel_entry.py scripts/validate_this.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-outputs
          path: |
            ci_runs/**/metrics.json
            ci_runs/**/report.md
            ci_runs/smoke/viz/
            ci_paper/
          retention-days: 7
