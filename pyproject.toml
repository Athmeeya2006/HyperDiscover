[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperdiscover"
version = "0.1.0.dev0"
description = "Joint discovery of higher-order network structure and symbolic governing equations from node time series."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HyperDiscover authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "sympy>=1.12",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
sr = ["pysr==2.7.2", "juliacall==0.9.36"]
baselines = ["pysindy>=1.7"]
rollout = ["torchdiffeq>=0.2.3"]
hypergraph = ["xgi>=0.7"]
demo = ["gradio>=4.0"]
dev = ["pytest>=7.4", "pytest-timeout>=2.2", "ruff>=0.5", "pre-commit>=3.5"]
all = ["hyperdiscover[sr,baselines,rollout,hypergraph,demo,dev]"]

[project.scripts]
hyperdiscover-run = "hyperdiscover.cli:run_pipeline_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "E501", "B028", "B905"]  # B905: zip(strict=) noise on paired slices

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (end-to-end pipeline); deselect with -m 'not slow'",
    "pysr: requires PySR + a working Julia install",
    "timeout: per-test timeout (pytest-timeout plugin)",
]
filterwarnings = ["ignore::DeprecationWarning"]
