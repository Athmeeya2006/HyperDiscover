# Phase-4 pilot, round 2: alternating convex gating (D-029) vs the hard-concrete defaults, S4 sanity case.
hard_concrete_base: {}
hard_concrete_lam5x:
  train: {pairwise: {warmup_steps: 1000, beta_start: 0.3, beta_end: 0.1, lam_pair: 0.05},
          triadic: {warmup_steps: 500, beta_start: 0.3, beta_end: 0.1, lam_tri: 0.1},
          joint: {beta_start: 0.2, beta_end: 0.05, lam_pair: 0.05, lam_tri: 0.1}}
alt_default:
  gating: alternating
alt_tri4x:
  gating: alternating
  train: {alternating: {tri_penalty: 4.0}}
alt_tri1x:
  gating: alternating
  train: {alternating: {tri_penalty: 1.0}}
alt_long:
  gating: alternating
  train: {alternating: {rounds: 14, steps_per_round: 600, first_round_steps: 2500}}
alt_aic:
  gating: alternating
  train: {alternating: {criterion: aic}}
alt_no_pair_stage:
  gating: alternating
  train: {alternating: {pair_only_rounds: 0}}
