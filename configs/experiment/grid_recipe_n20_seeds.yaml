# 5-seed extension of grid_recipe_n20.yaml (seeds 1–4; seed 0 = hd-recipe-n20-v3) for §18.5 statistics.
# sparse ICs + many short trajectories) scaled to all systems at N=20, open and closed hyperedges, plus the
# pairwise-only variants (false-hyperedge control). Noise 0 and 1%.
systems: [S1, S2, S3, S4, S5]
hyper_kinds: [open, closed]
N: [20]
noise: [0.0, 0.01]
seeds: [1, 2, 3, 4]
pairwise_only_variants: true
graph: er
mean_degree: 4.0
hyper_density: 0.3
M: 400
T: 25
ic_mode: sparse
